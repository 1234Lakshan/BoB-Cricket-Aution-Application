<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battle of Brothers – Player Call</title>
<link rel="icon" href="assets/battle_of_brothers.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,700;1,800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <aside class="console">
    <img class="main-logo" src="assets/battle_of_brothers.jpg" alt="Battle of Brothers Cricket Tournament">

    <label for="num">Player number</label>
    <div class="pick">
      <button id="prev" aria-label="Previous player">‹</button>
      <input id="num" type="number" min="1" max="63" inputmode="numeric" placeholder="1 – 24">
      <button id="next" aria-label="Next player">›</button>
    </div>
    <button class="primary" id="show">Show player</button>

    <p class="hint">Sell this player to</p>
    <div class="sell">
      <button class="team-btn fire" id="sellFire"><img src="assets/fire_blasters.png" alt=""><span>Fire Blasters</span></button>
      <button class="team-btn lions" id="sellLions"><img src="assets/royal_lions.png" alt=""><span>Royal Lions</span></button>
    </div>
    <div class="pair">
      <button id="unsold">Mark unsold</button>
      <button id="undo">Undo last sale</button>
    </div>

    <div class="tools">
      <button id="stage">Stage mode (F)</button>
      <button id="csv">Download squads</button>
      <button id="reset">Reset all</button>
    </div>
  </aside>

  <main class="stage">
    <section class="squad fire" id="squadFire" aria-label="Fire Blasters squad"></section>

    <section class="center">
      <div class="empty" id="empty">
        <img src="assets/battle_of_brothers.jpg" alt="">
        <p>Enter a player number to call them up.</p>
      </div>
      <div class="player" id="player" hidden>
        <img id="cardImg" alt="Player card" title="Click for full screen">
        <div class="status" id="status"></div>
      </div>
    </section>

    <section class="squad lions" id="squadLions" aria-label="Royal Lions squad"></section>

    <div class="sold" id="sold" hidden></div>
  </main>

</div>
<script src="script.js"></script>
</body>
</html>
